name: Telegram String Session Generator

on:
  workflow_dispatch:
    inputs:
      connection_method:
        description: 'Connection Method'
        type: choice
        required: true
        default: 'web_terminal'
        options:
          - 'web_terminal'
          - 'ssh_upterm'
          - 'both'
      timeout_minutes:
        description: 'Session Timeout in Minutes'
        required: false
        default: '15'
        type: string
      api_id:
        description: 'Telegram API ID (Optional)'
        required: false
        default: ''
        type: string
      api_hash:
        description: 'Telegram API HASH (Optional)'
        required: false
        default: ''
        type: string
      old_string_session:
        description: 'Old String Session (Optional for Option 4)'
        required: false
        default: ''
        type: string

jobs:
  generate-session:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install telethon pyrofork tgcrypto
          sudo mkdir -p /opt/pyrogram_official
          sudo pip install --target /opt/pyrogram_official pyrogram tgcrypto

      - name: Install Web Terminal Tools (ttyd & cloudflared)
        if: ${{ github.event.inputs.connection_method == 'web_terminal' || github.event.inputs.connection_method == 'both' || github.event_name != 'workflow_dispatch' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y curl openssl psmisc
          sudo systemctl stop ttyd 2>/dev/null || true
          sudo systemctl disable ttyd 2>/dev/null || true
          sudo pkill -9 -x ttyd 2>/dev/null || true
          curl -sL https://github.com/tsl0922/ttyd/releases/download/1.7.7/ttyd.x86_64 -o /usr/local/bin/ttyd
          chmod +x /usr/local/bin/ttyd
          curl -sL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /usr/local/bin/cloudflared
          chmod +x /usr/local/bin/cloudflared

      - name: Start Web Terminal (Browser Access)
        if: ${{ github.event.inputs.connection_method == 'web_terminal' || github.event.inputs.connection_method == 'both' || github.event_name != 'workflow_dispatch' }}
        env:
          API_ID: ${{ github.event.inputs.api_id || secrets.API_ID }}
          API_HASH: ${{ github.event.inputs.api_hash || secrets.API_HASH }}
          OLD_STRING_SESSION: ${{ github.event.inputs.old_string_session }}
        run: |
          cat << 'EOF' > /tmp/run_session.sh
          #!/usr/bin/env bash
          cd "$GITHUB_WORKSPACE"
          python3 main.py
          echo ""
          echo "=========================================================="
          echo "✅ Execution finished! You can close this browser tab."
          echo "=========================================================="
          touch /tmp/session_done
          exec bash
          EOF
          chmod +x /tmp/run_session.sh

          sudo systemctl stop ttyd 2>/dev/null || true
          sudo systemctl disable ttyd 2>/dev/null || true
          sudo fuser -k 7681/tcp 2>/dev/null || true
          sudo pkill -9 -x ttyd 2>/dev/null || true
          sleep 1

          WEB_USER="admin"
          WEB_PASS=$(openssl rand -hex 8)

          ttyd -W -p 7681 -c "${WEB_USER}:${WEB_PASS}" bash /tmp/run_session.sh > /tmp/ttyd.log 2>&1 &
          TTYD_PID=$!
          sleep 2

          if ! kill -0 $TTYD_PID 2>/dev/null; then
            echo "❌ ttyd failed to start. Logs:"
            cat /tmp/ttyd.log
            exit 1
          fi

          cloudflared tunnel --url http://127.0.0.1:7681 --logfile /tmp/cf_tunnel.log --no-autoupdate > /dev/null 2>&1 &
          CF_PID=$!

          echo "Waiting for Cloudflare Tunnel URL..."
          URL=""
          for i in {1..30}; do
            URL=$(grep -oE "https://[a-zA-Z0-9.-]+\.trycloudflare\.com" /tmp/cf_tunnel.log 2>/dev/null | head -n 1 || true)
            if [ -n "$URL" ]; then
              break
            fi
            if ! kill -0 $CF_PID 2>/dev/null; then
              echo "❌ cloudflared process died unexpectedly. Logs:"
              cat /tmp/cf_tunnel.log 2>/dev/null || true
              exit 1
            fi
            sleep 2
          done

          if [ -z "$URL" ]; then
            echo "❌ Failed to obtain Cloudflare Tunnel URL within 60s. Tunnel logs:"
            cat /tmp/cf_tunnel.log
            exit 1
          fi

          echo "===================================================================="
          echo "🚀 WEB TERMINAL IS READY!"
          echo "👉 OPEN THIS URL IN YOUR BROWSER:"
          echo "🔗 $URL"
          echo "👤 Username: $WEB_USER"
          echo "🔑 Password: $WEB_PASS"
          echo "===================================================================="

          echo "## 🚀 Telegram String Session Generator" >> $GITHUB_STEP_SUMMARY
          echo "### 🌐 Web Terminal Access" >> $GITHUB_STEP_SUMMARY
          echo "Click the link below to open the interactive session generator directly in your browser:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **🔗 Web Terminal URL:** [$URL]($URL)" >> $GITHUB_STEP_SUMMARY
          echo "- **👤 Username:** \`$WEB_USER\`" >> $GITHUB_STEP_SUMMARY
          echo "- **🔑 Password:** \`$WEB_PASS\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ github.event.inputs.connection_method }}" != "both" ]; then
            TIMEOUT_MIN=${{ github.event.inputs.timeout_minutes || '15' }}
            echo "⏳ Session will remain active for up to $TIMEOUT_MIN minutes..."
            END_TIME=$((SECONDS + TIMEOUT_MIN * 60))
            while [ $SECONDS -lt $END_TIME ]; do
              if [ -f /tmp/session_done ]; then
                echo "✅ Session generation completed! Keeping active for 60 seconds before closing..."
                sleep 60
                break
              fi
              sleep 5
            done
          fi

      - name: Setup SSH Terminal (Upterm)
        if: ${{ github.event.inputs.connection_method == 'ssh_upterm' || github.event.inputs.connection_method == 'both' }}
        uses: owenthereal/action-upterm@v2
        with:
          limit-access-to-actor: false
